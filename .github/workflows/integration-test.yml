name: Integration Tests

on:
  push:
    branches: [main, master, claude/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run integration tests
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
          SALAD_TEST_ORG: ${{ secrets.SALAD_ORG_ID != '' && secrets.SALAD_ORG_ID || 'test-org' }}
          SALAD_TEST_PROJECT: ${{ secrets.SALAD_ORG_PROJECT != '' && secrets.SALAD_ORG_PROJECT || 'test-project' }}
        run: npm test

      - name: Run auto-eval with LLM judge
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          SALAD_TEST_ORG: ${{ secrets.SALAD_ORG_ID != '' && secrets.SALAD_ORG_ID || 'test-org' }}
          SALAD_TEST_PROJECT: ${{ secrets.SALAD_ORG_PROJECT != '' && secrets.SALAD_ORG_PROJECT || 'test-project' }}
        run: npm run eval

  gpu-tests:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run GPU community tests
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          SALAD_TEST_ORG: ${{ secrets.SALAD_ORG_ID != '' && secrets.SALAD_ORG_ID || 'test-org' }}
          SALAD_TEST_PROJECT: ${{ secrets.SALAD_ORG_PROJECT != '' && secrets.SALAD_ORG_PROJECT || 'test-project' }}
        run: npm run test:gpu
